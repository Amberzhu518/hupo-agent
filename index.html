<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>琥珀的agent · 个人成长管家</title>
<link rel="icon" type="image/png" href="icon.png" sizes="512x512">
<link rel="apple-touch-icon" href="icon.png" sizes="512x512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="琥珀">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5b9cf0">
<style>
  :root{
    --blue:#5b9cf0; --blue-soft:#eaf4ff; --pink:#ff9ec4; --pink-soft:#fdeef4;
    --green:#5ed6a6; --purple:#b69cf0; --orange:#ffb86b; --gold:#ffce5c;
    --text:#3a3f55; --text-soft:#7a819a; --card:#ffffff; --line:#eef1f8;
    --shadow:0 8px 24px rgba(120,140,200,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--text);background:linear-gradient(135deg,#eaf6ff 0%,#fdeef4 60%,#f3ecff 100%);
    min-height:100vh;padding:14px;
  }
  .app{display:flex;gap:14px;max-width:1180px;margin:0 auto;height:calc(100vh - 28px)}
  /* 侧边栏 —— 可收起（桌面）/ 抽屉（手机） */
  .side{width:188px;flex:0 0 188px;background:rgba(255,255,255,.78);backdrop-filter:blur(8px);
    border-radius:20px;box-shadow:var(--shadow);padding:16px 12px;display:flex;flex-direction:column;gap:6px;overflow:hidden;
    transition:width .25s ease,flex-basis .25s ease,padding .25s ease,opacity .25s ease}
  .side.collapsed{width:0;flex:0 0 0;padding:0;opacity:0;pointer-events:none;margin-right:-14px}
  .side .nav-text{display:inline-block;white-space:nowrap;transition:opacity .15s ease}
  .side.collapsed .logo,.side.collapsed .side-foot,.side.collapsed .nav-text{display:none}
  .side.collapsed .nav-btn{padding:10px 0;justify-content:center}
  .side.collapsed .nav-btn .ic{margin:0;font-size:18px}
  .logo{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
  .logo .ava{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--pink));display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 38px;overflow:hidden;cursor:pointer}
  .logo .ava img{width:100%;height:100%;object-fit:cover;display:block}
  .logo b{font-size:15px}
  .logo small{display:block;color:var(--text-soft);font-size:11px;font-weight:400}
  /* 菜单按钮（顶栏左上） */
  .menu-btn{border:none;background:var(--blue-soft);color:var(--blue);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex:0 0 36px}
  .menu-btn:hover{background:#dcebff}
  /* 侧栏关闭按钮（手机抽屉内） */
  .side-close{border:none;background:#f0f2f8;width:30px;height:30px;border-radius:10px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--text-soft);align-self:flex-end;margin-bottom:4px}
  .side-close:hover{background:#e6e9f3}
  /* 手机抽屉遮罩 */
  .side-mask{position:fixed;inset:0;background:rgba(40,46,70,.45);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s ease}
  .side-mask.show{opacity:1;pointer-events:auto}
  /* 手机版：侧栏变成抽屉（<640px） */
  @media(max-width:640px){
    .app{padding:0 8px}
    .side{position:fixed;top:14px;left:14px;bottom:14px;width:240px;flex:0 0 240px;z-index:100;box-shadow:0 12px 36px rgba(40,46,70,.25);
      transform:translateX(-260px);opacity:0;pointer-events:none;transition:transform .25s ease,opacity .2s ease;height:auto}
    .side.open{transform:translateX(0);opacity:1;pointer-events:auto}
    .side.collapsed{transform:translateX(-260px);opacity:0;pointer-events:none}
  }
  @media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}}
  .logo b{font-size:15px}
  .logo small{display:block;color:var(--text-soft);font-size:11px;font-weight:400}
  .nav-btn{border:none;background:transparent;text-align:left;padding:10px 12px;border-radius:12px;cursor:pointer;
    font-size:14px;color:var(--text);display:flex;align-items:center;gap:9px;transition:.15s}
  .nav-btn:hover{background:var(--blue-soft)}
  .nav-btn.active{background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff;box-shadow:0 4px 12px rgba(120,140,200,.3)}
  .nav-btn .ic{font-size:16px}
  .side-foot{margin-top:auto;font-size:11px;color:var(--text-soft);padding:8px}
  /* 主区 */
  .main{flex:1;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);border-radius:20px;
    box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;overflow:hidden}
  .topbar{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .topbar .title{font-size:18px;font-weight:700}
  .stat{display:flex;align-items:center;gap:7px;background:var(--blue-soft);padding:6px 12px;border-radius:12px;font-size:13px}
  .stat.coin{background:#fff6e0}.stat.fire{background:#ffe9ef}.stat.clock{background:#eef3ff}.stat.count{background:#fff0f6;color:#d0588f;font-weight:600}
  .xpwrap{flex:1;min-width:160px}
  .xpbar{height:12px;background:#eef1f8;border-radius:8px;overflow:hidden}
  .xpfill{height:100%;background:linear-gradient(90deg,var(--blue),var(--pink));border-radius:8px;transition:.4s}
  .xptxt{font-size:11px;color:var(--text-soft);margin-top:3px}
  .dot{width:9px;height:9px;border-radius:50%;background:#bbb;display:inline-block}
  .dot.synced{background:var(--green)} .dot.offline{background:#e06a6a} .dot.syncing{background:var(--gold);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .view{flex:1;overflow:auto;padding-top:16px}
  /* 卡片通用 */
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
  .card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 4px 14px rgba(120,140,200,.08);border:1px solid var(--line)}
  .card h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:7px}
  .big{font-size:26px;font-weight:800}
  .sub{color:var(--text-soft);font-size:12px}
  .bar{height:10px;background:#eef1f8;border-radius:6px;overflow:hidden;margin-top:8px}
  .bar>div{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--pink));transition:.4s}
  .bar.green>div{background:linear-gradient(90deg,var(--green),#9be8c8)}
  .bar.gold>div{background:linear-gradient(90deg,var(--gold),#ffd98a)}
  .row{display:flex;justify-content:space-between;align-items:center;font-size:13px}
  /* 对话 */
  .chat{flex:1;display:flex;flex-direction:column;height:100%}
  .msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-right:6px}
  .msg{max-width:80%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .msg.bot{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
  .msg.me{background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0}
  .chip{border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer}
  .chip:hover{background:var(--blue-soft)}
  .inputbar{display:flex;gap:8px;padding-top:10px;align-items:center}
  .inputbar input{flex:1;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:14px;outline:none;min-width:0}
  .inputbar input:focus{border-color:var(--blue)}
  .iconbtn{border:none;background:var(--blue-soft);color:var(--blue);width:44px;height:44px;border-radius:14px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
  .iconbtn:hover{background:#dcebff}
  .iconbtn.recording{background:var(--pink);color:#fff;animation:pulse 1s infinite}
  .btn{border:none;background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff;padding:0 20px;border-radius:14px;
    font-size:14px;cursor:pointer;font-weight:600;height:44px}
  .btn:hover{opacity:.92}.btn.sm{padding:6px 12px;font-size:12px;border-radius:10px;height:auto}
  .btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
  /* 列表 */
  .item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:#fafbff;border:1px solid var(--line);margin-bottom:8px}
  .item .main{flex:1;font-size:13px}
  .item.done .main{text-decoration:line-through;color:var(--text-soft)}
  .tag{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--blue-soft);color:var(--blue)}
  .tag.p{background:#fff6e0;color:#c98a2a}.tag.c{background:#e9fbf2;color:#2a9c74}.tag.o{background:#f0ecff;color:#7a5bd0}
  .tag.imp{background:#ffe3ee;color:#d0588f}
  .check{width:20px;height:20px;border-radius:6px;border:2px solid var(--blue);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;flex:0 0 20px}
  .check.on{background:var(--blue);border-color:var(--blue)}
  .note{background:#fafbff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .note-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .note-h .sub{font-size:11px;color:var(--text-soft);margin-left:2px}
  .note-pts{margin:8px 0 0;padding-left:20px;font-size:13px;line-height:1.7}
  .note-pts>li{margin-bottom:10px}
  .note-item .note-t{font-weight:600;color:var(--text)}
  .note-item .note-d{margin:4px 0 0;color:var(--text-soft);font-size:12.5px;line-height:1.8;background:#f3f6ff;border-left:3px solid var(--blue);padding:7px 10px;border-radius:0 8px 8px 0}
  .note-sub{margin:5px 0 0 4px;padding-left:16px;list-style:circle}
  .note-sub>li{margin-bottom:3px;font-size:12px;color:var(--text-soft)}
  .addbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .addbar input,.addbar select,.addbar textarea{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;outline:none;min-width:0;font-family:inherit}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--text-soft);font-weight:600;font-size:12px}
  .empty{color:var(--text-soft);font-size:13px;text-align:center;padding:24px}
  .ach{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;border-radius:16px;background:#fafbff;border:1px solid var(--line);text-align:center}
  .ach .medal{font-size:30px;filter:grayscale(1);opacity:.4}
  .ach.on .medal{filter:none;opacity:1}
  .ach.on{border-color:var(--gold);background:#fffaf0}
  .ach small{font-size:11px;color:var(--text-soft)}
  /* 博主卡片：标题第一排 + 简介 + 外联紧贴下方 */
  .broker{padding:10px 0;border-bottom:1px dashed var(--line)}
  .broker:last-of-type{border-bottom:0}
  .broker-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
  .broker-head .ic{font-size:18px}
  .broker-head b{font-size:15px}
  .broker-tag{font-size:11px;color:var(--text-soft);background:var(--blue-soft);color:var(--blue);padding:2px 8px;border-radius:8px;font-weight:500}
  .broker-sub{font-size:12px;color:var(--text-soft);margin:4px 0 8px 26px}
  /* 今日速览卡片 */
  .today-digest h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .today-digest h3 .sub{flex:1;font-weight:400;margin-left:2px}
  /* 琥珀来信（云端推送卡片） */
  .inbox{border-color:var(--pink);background:linear-gradient(180deg,rgba(255,158,196,.10),rgba(255,255,255,.6))}
  .inbox-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .inbox-head h3{margin:0}
  .inbox-head .sub{flex:1;font-weight:400;color:var(--text-soft);font-size:12px}
  .inbox-cat{margin:12px 0 6px;font-size:14px;color:var(--text)}
  .inbox-list{list-style:none;margin:0;padding:0}
  .inbox-item{padding:10px 0;border-top:1px dashed var(--line);position:relative}
  .inbox-item:first-child{border-top:0}
  .inbox-item.read{opacity:.55}
  .inbox-title{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
  .inbox-point{font-size:13px;color:var(--text);margin-top:3px;line-height:1.5}
  .inbox-why{font-size:12px;color:var(--text-soft);margin-top:3px}
  .inbox-link{display:inline-block;margin-top:5px;font-size:12px;color:var(--blue);text-decoration:none}
  .inbox-mark{position:absolute;right:0;top:10px;font-size:11px;color:var(--blue);cursor:pointer;user-select:none}
  .inbox-item.read .inbox-mark{color:var(--text-soft)}
  .inbox-rem{font-size:13px;line-height:1.6;color:var(--text);white-space:pre-wrap;padding:8px 0;position:relative}
  .inbox-rem.read{opacity:.6}
  .dot-new{font-size:10px;background:#e0518a;color:#fff;border-radius:6px;padding:1px 6px;font-weight:500}
  .digest-item{padding:10px 0;border-top:1px dashed var(--line)}
  .digest-item:first-child{border-top:0;padding-top:4px}
  .digest-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .digest-cat{font-size:11px;padding:2px 8px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff;font-weight:500}
  .digest-h b{font-size:14px}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#3a3f55;color:#fff;padding:10px 18px;border-radius:14px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
  .toast.show{opacity:1}
  /* 技能卡片 */
  .skill{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 14px;border-radius:18px;background:#fff;border:1px solid var(--line);cursor:pointer;transition:.15s;text-align:center}
  .skill:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(120,140,200,.18);border-color:var(--blue)}
  .skill .emo{font-size:34px}
  .skill b{font-size:14px}
  .skill small{font-size:11px;color:var(--text-soft)}
  /* 相册 */
  .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
  .photo{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fafbff}
  .photo img{width:100%;height:120px;object-fit:cover;display:block}
  .photo .cap{font-size:11px;color:var(--text-soft);padding:6px 8px}
  /* 弹窗 */
  .modal-mask{position:fixed;inset:0;background:rgba(40,46,70,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
  .modal{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(40,46,70,.3)}
  .modal h2{font-size:18px;display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .modal .close{margin-left:auto;border:none;background:#f0f2f8;width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:16px}
  .modal label{display:block;font-size:12px;color:var(--text-soft);margin:10px 0 4px}
  .modal input,.modal textarea,.modal select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;outline:none;font-family:inherit}
  .modal .row2{display:flex;gap:10px}.modal .row2>*{flex:1}
  .preview{background:#fafbff;border:1px solid var(--line);border-radius:12px;padding:12px;max-height:260px;overflow:auto;margin-top:10px;font-size:12px}
  .modal video{width:100%;border-radius:12px;background:#000}
  .canvasprev{width:100%;border-radius:12px;border:1px solid var(--line);margin-top:10px;background:#fff}
  @media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <!-- 手机抽屉遮罩 -->
  <div class="side-mask" id="sideMask" onclick="App.toggleSide(false)"></div>
  <!-- 侧边栏 -->
  <aside class="side" id="side">
    <button class="side-close" id="sideClose" onclick="App.toggleSide(false)" title="收起侧栏">✕</button>
    <div class="logo">
      <div class="ava" onclick="changeAvatar()" title="点击更换头像"><img src="avatar.png" alt="头像" onerror="this.parentNode.textContent='🟡'"/></div>
      <div><b>琥珀的agent</b><small>个人成长管家</small></div>
    </div>
    <button class="nav-btn active" data-v="overview"><span class="ic">🏠</span><span class="nav-text">概览</span></button>
    <button class="nav-btn" data-v="chat"><span class="ic">💬</span><span class="nav-text">对话</span></button>
    <button class="nav-btn" data-v="goals"><span class="ic">🎯</span><span class="nav-text">目标</span></button>
    <button class="nav-btn" data-v="tasks"><span class="ic">📝</span><span class="nav-text">待办</span></button>
    <button class="nav-btn" data-v="research"><span class="ic">📚</span><span class="nav-text">科研/学习</span></button>
    <button class="nav-btn" data-v="finance"><span class="ic">💰</span><span class="nav-text">财务</span></button>
    <button class="nav-btn" data-v="exercise"><span class="ic">🏃</span><span class="nav-text">运动健康</span></button>
    <button class="nav-btn" data-v="skills"><span class="ic">🛠️</span><span class="nav-text">技能中心</span></button>
    <button class="nav-btn" data-v="photos"><span class="ic">🖼️</span><span class="nav-text">相册</span></button>
    <button class="nav-btn" data-v="review"><span class="ic">🪞</span><span class="nav-text">复盘</span></button>
    <button class="nav-btn" data-v="ach"><span class="ic">🏆</span><span class="nav-text">成就墙</span></button>
    <div class="side-foot">数据优先存云端同步<br>点右上「数据」可备份</div>
  </aside>

  <!-- 主区 -->
  <section class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" onclick="App.toggleSide()" title="显示/收起侧栏">☰</button>
      <div class="title" id="viewTitle">工作台概览</div>
      <div class="stat clock" id="clock">--</div>
      <div class="stat count" id="countdown">⏰ 暂无倒计时提醒</div>
      <div class="stat">🟡 LV<span id="tLv">1</span></div>
      <div class="stat coin">🪙 <span id="tCoin">0</span></div>
      <div class="stat fire">🔥 <span id="tStreak">0</span>天</div>
      <div class="xpwrap">
        <div class="xpbar"><div class="xpfill" id="tXpFill" style="width:0%"></div></div>
        <div class="xptxt" id="tXpTxt">XP 0 / 100</div>
      </div>
      <span class="stat" title="同步状态：点击手动同步" style="cursor:pointer" onclick="App.syncNow()"><span class="dot" id="syncDot"></span> <span id="syncTxt">同步</span></span>
      <button class="btn sm ghost" onclick="App.openData()">数据</button>
    </div>
    <div class="view" id="view"></div>
  </section>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="fileJson" accept="application/json" style="display:none" />
<input type="file" id="fileXlsx" accept=".xlsx,.xls" style="display:none" />
<input type="file" id="fileImg" accept="image/*" style="display:none" />
<div id="modalRoot"></div>

<!-- 本地技能库（离线可用） -->
<script src="./libs/chart.umd.min.js"></script>
<script src="./libs/xlsx.full.min.js"></script>
<script src="./libs/pptxgen.bundle.js"></script>
<script src="./libs/docx.umd.js"></script>
<script src="./libs/html-to-image.js"></script>
<script>
/* ============ 数据模型 ============ */
const STORE_KEY = 'hupo_agent_v2';
function mondayOf(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x;}
function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function pad(n){return String(n).padStart(2,'0');}

const REWARDS = {
  study:{xp:20,coin:5,label:'学习打卡'},
  exercise:{xp:15,coin:4,label:'运动打卡'},
  review:{xp:25,coin:6,label:'每日复盘'},

function gainXP(xp, coin, reason){
  state.xp += xp; state.mucoins += coin;
  let leveled = false;

    state.xp -= state.xpToNext;
    state.level += 1;
    state.xpToNext = Math.round(state.xpToNext * 1.4);
    leveled = true;
  }
  if(state.level >= 5) unlockAch('lv5');
  if(state.mucoins >= 100) unlockAch('coin100');
  return leveled;
}

// 推送文件独立于 state，存于 hupo-agent-data 仓库的 push/YYYY-MM-DD.json，避免整文件 state 覆盖冲突
async function fetchPushes(){
  if(syncProvider!=='github' && syncProvider!=='gitee'){ return; }
  try{
    let listUrl, headers;
    if(syncProvider==='github'){
      if(!ghToken||!ghOwner){ return; }
      listUrl='https://api.github.com/repos/'+ghOwner+'/'+ghDataRepo+'/contents/push';
      headers=ghHeaders();
    } else {
      if(!gtToken||!gtOwner){ return; }
      listUrl=GT_API+'/repos/'+gtOwner+'/'+gtDataRepo+'/contents/push?access_token='+gtToken;
      headers={};
    }
    const r=await fetch(listUrl,{headers});
    if(!r.ok){ pushCache={digest:{},reminder:null}; return; }
    const arr=await r.json();
    const names=(Array.isArray(arr)?arr:[]).map(x=>x.name||'').filter(n=>/^\d{4}-\d{2}-\d{2}\.json$/.test(n)).sort().slice(-7);
    const out={digest:{},reminder:null};
    for(const n of names){
      try{
        let fr, fj;
        if(syncProvider==='github'){
          fr=await fetch('https://api.github.com/repos/'+ghOwner+'/'+ghDataRepo+'/contents/push/'+n, {headers});
          if(!fr.ok) continue; fj=await fr.json();
        } else {
          fr=await fetch(GT_API+'/repos/'+gtOwner+'/'+gtDataRepo+'/contents/push/'+n+'?access_token='+gtToken);
          if(!fr.ok) continue; fj=await fr.json();
        }
        const d=JSON.parse(unb64u(fj.content));
        Object.keys(d.digest||{}).forEach(c=>{ out.digest[c]=(out.digest[c]||[]).concat(d.digest[c]||[]); });
        if(d.reminder) out.reminder=d.reminder;
      }catch(e){}
    }
    pushCache=out;
    if(curView==='overview') render();
  }catch(e){ pushCache={digest:{},reminder:null}; }
}

/* ============ 自然语言解析 ============ */
function extractMinutes(t){
  let m=t.match(/(\d+(?:\.\d+)?)\s*(小时|个?小时|h|hr)/);
  if(m) return Math.round(parseFloat(m[1])*60);
  m=t.match(/(\d+)\s*(分钟|分|min)/);
  if(m) return parseInt(m[1]);
  if(/整天|一整天|全天/.test(t)) return 480;
  if(/半天/.test(t)) return 240;
  return null;
}
function extractSteps(t){const m=t.match(/(\d+)\s*(步|步数)/);return m?parseInt(m[1]):null;}
function extractAmount(t){const m=t.match(/[¥￥]?\s*(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):null;}
function catOf(t){ if(/公司|垫付|报销/.test(t)) return 'company'; if(/其他/.test(t)) return 'other'; return 'personal'; }

function parseDue(text){
  const now=new Date(); let d=new Date(now); let matched=false; let m;
  if((m=text.match(/(\d+)\s*天后/))){ d.setDate(d.getDate()+parseInt(m[1])); matched=true; }
  else if(/后天/.test(text)){ d.setDate(d.getDate()+2); matched=true; }
  else if(/明天|次日/.test(text)){ d.setDate(d.getDate()+1); matched=true; }
  else if(/今天|今日/.test(text)){ matched=true; }
  let h=-1,min=0;
  if((m=text.match(/(\d{1,2})[:：](\d{2})/))){ h=parseInt(m[1]); min=parseInt(m[2]); }
  else if((m=text.match(/(上午|早上|中午|下午|晚上|傍晚)\s*(\d{1,2})\s*点/))){ let base=parseInt(m[2]); const ap=m[1]; if(ap==='下午'||ap==='晚上'||ap==='傍晚'){ if(base<12) base+=12; } h=base; min=0; }
  else if((m=text.match(/(\d{1,2})\s*点/))){ h=parseInt(m[1]); min=0; }
  if(h>=0){ d.setHours(h,min,0,0); matched=true; }
  if(!matched) return null;
  if(d.getTime() < now.getTime()-60000) return null;
  return d.getTime();
}
function isImportant(t){ return /重要|紧急|务必|记得|提醒|别忘|千万别忘|必须/.test(t); }

function handleInput(raw){

    else{
      const y = new Date(); y.setDate(y.getDate()-1); const yd = y.getFullYear()+'-'+pad(y.getMonth()+1)+'-'+pad(y.getDate());
      state.streak = (state.lastCheckin===yd)? state.streak+1 : 1;

    state.reviews.unshift({date:todayStr(), text:content});

  }

    let txt = t.replace(/^(提醒我|提醒|闹钟|待办|任务|todo|要做|加|添加|新增|记)[:：]?\s*/,'').replace(/重要|紧急|务必/g,'').trim()||t;
    const due = parseDue(t);
    const imp = isImportant(t);
    const item={text:txt, done:false, date:todayStr(), due:due, important:imp};
    state.tasksAll.unshift(item); state.tasksToday.unshift(item);
    reply='已添加'+(imp?'⭐重要':'')+'待办 📝：'+txt + (due?('（⏰ '+fmtDue(due)+'）'):'');
  }
  // 学习
  else if(/学习|学了|看书|上课|网课/.test(t) && !/文献|论文/.test(t)){
    const min = extractMinutes(t) || 60;
    state.weekly.study += 1;
    const lv=gainXP(REWARDS.study.xp,REWARDS.study.coin);
    if(state.weekly.study>=state.weekly.targetStudy) unlockAch('week_study');
    unlockAch('first_study');

    const ok = (steps && steps>=5000) || (min && min>=30);

      state.exercise.unshift({date:todayStr(), min:min||0, steps:steps||0});

    }
  }

  else if(/科研任务|研究任务|课题/.test(t)){

    state.research.unshift({name, done:false, date:todayStr()});
    const lv=gainXP(REWARDS.research.xp,REWARDS.research.coin);
    reply='已添加科研任务 🔬《'+name+'》 +'+REWARDS.research.xp+'XP +'+REWARDS.research.coin+'木币'+(lv?'，升级啦！':'');
  }
  // 灵感
  else if(/灵感|点子|想法|创意/.test(t)){
    const name = t.replace(/^.*(灵感|点子|想法|创意)[:：]?/,'').trim()||'未命名灵感';
    state.ideas.unshift({name, date:todayStr()});
    reply='灵感已收入想法箱 💡：'+name;
  }
  // 待办：完成
  else if(/(完成|做完|勾掉|搞定).*(待办|任务)|待办.*(完成|做完)|完成待办/.test(t)){
    const m=t.match(/(\d+)/);
    if(m){ const i=parseInt(m[1])-1; if(state.tasksAll[i]){ state.tasksAll[i].done=true; reply='已完成待办 ✓：'+state.tasksAll[i].text; } else reply='没找到第 '+m[1]+' 条待办哦'; }
    else {
      const kw=t.replace(/.*(完成|做完|勾掉|搞定)/,'').replace(/(待办|任务)/g,'').trim();
      const it=state.tasksAll.find(x=>!x.done && x.text.includes(kw));
      if(it){it.done=true;reply='已完成待办 ✓：'+it.text;} else reply='没匹配到要完成的待办～';
    }
  }
  // 待办：新增（无时间）
  else if(/待办|任务|todo|要做/.test(t)){
    const txt = t.replace(/^(加|添加|新增|记)?\s*(待办|任务|todo|要做)[:：]?/,'').trim()||t;
    const item={text:txt,done:false,date:todayStr(),due:null,important:false};
    state.tasksAll.unshift(item); state.tasksToday.unshift(item);
    reply='已添加待办 📝：'+txt;
  }
  // 收支
  else if(/支出|花费|花|买|付|收入|工资|报销|入账/.test(t)){
    const amt = extractAmount(t);
    if(amt==null){ reply='没识别到金额，试试「支出 35 午饭 个人」这样的格式～'; }
    else{
      const isIncome = /收入|工资|报销|入账/.test(t) && !/支出|花|买|付/.test(t);
      const cat = isIncome? 'income' : catOf(t);
      const note = t.replace(/[¥￥]?\d+(\.\d+)?/g,'').replace(/^(支出|花费|收入|花|买|付|报销|入账)[:：]?/,'').replace(/(个人|公司|垫付|其他|报销)/g,'').trim()||'未备注';
      state.finance.unshift({type:isIncome?'收入':'支出', amount:amt, cat, note, date:todayStr()});
      if(!isIncome){
        if(cat==='company') state.budget.company+=amt; else if(cat==='other') state.budget.other+=amt; else state.budget.personal+=amt;
      }
      reply=(isIncome?'已记收入 💰':'已记支出 💸')+' '+amt+' 元（'+(cat==='income'?'收入':cat==='company'?'公司垫付':cat==='other'?'其他':'个人')+'）'+note;
    }
  }
  // 成就
  else if(/成就|里程碑/.test(t)){
    const name = t.replace(/^.*(成就|里程碑)[:：]?/,'').trim()||'我的成就';
    state.achievements.unshift({id:'u_'+Date.now(),name,desc:'自定义',got:true});
    const lv=gainXP(REWARDS.achievement.xp,REWARDS.achievement.coin);
    reply='成就已点亮 🏆《'+name+'》 +'+REWARDS.achievement.xp+'XP +'+REWARDS.achievement.coin+'木币'+(lv?'，升级啦！':'');
  }
  // 内容笔记（要点 + 跳转链接）：笔记 标题 | 要点1；要点2 | 链接
  else if(/^笔记/.test(t.trim())){
    const body=t.trim().replace(/^笔记[:：]?\s*/,'');
    const parts=body.split('|').map(s=>s.trim());
    const title=parts[0]||'未命名笔记';
    const points=(parts[1]||'').split(/[；;]/).map(s=>s.trim()).filter(Boolean);
    const link=parts[2]||'';
    state.notes.unshift({title, points, link, date:todayStr()});
    reply='已保存要点笔记 📒《'+title+'》'+(link?'（已附跳转链接）':'')+'，共 '+points.length+' 条要点。默认看要点即可，需要原文时点「🔗 查看原文」。';
  }
  // 查询
  else if(/状态|进度|木币|等级|概览|我的|怎么样|如何/.test(t)){
    reply = summaryText();
  }
  // 兜底
  else {
    reply='收到～如果你想记录点什么，可以这样跟我说：\n· 今天学习2小时\n· 运动40分钟\n· 提醒我明天15:00交报告（重要）\n· 复盘：今天……\n· 加待办 明天交报告\n· 支出 35 午饭 个人\n· 笔记 标题 | 要点1；要点2 | 链接\n· 我的状态';
  }
  state.chat.push({role:'bot',text:reply});
  save(); render();
  const msgs=document.getElementById('msgs'); if(msgs) msgs.scrollTop=msgs.scrollHeight;
}

function fmtDue(ts){ const d=new Date(ts); return (d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtDur(ms){ const s=Math.floor(ms/1000); const h=Math.floor(s/3600); const m=Math.floor((s%3600)/60); const ss=s%60; return (h>0?h+'小时':'')+m+'分'+(h===0?ss+'秒':''); }

function nearestDue(){ let best=null; const now=Date.now(); for(const t of state.tasksAll){ if(t.due && t.due>now && !t.done){ if(!best||t.due<best.due) best=t; } } return best; }

function summaryText(){
  const w=state.weekly;
  const per=(v,t)=>Math.round(v/t*100);
  let s='📊 你的工作台当前状态：\n';
  s+='🟡 LV'+state.level+'  XP '+state.xp+'/'+state.xpToNext+'  🪙 '+state.mucoins+'  🔥 连签 '+state.streak+' 天\n';
  s+='本周目标：学习 '+w.study+'/'+w.targetStudy+' · 运动 '+w.exercise+'/'+w.targetExercise+' · 复盘 '+w.review+'/'+w.targetReview+'\n';
  const used=state.budget.personal+state.budget.company+state.budget.other;
  s+='本月支出：'+used+' / '+state.budget.limit+' 元（个人 '+state.budget.personal+'）\n';
  const undone=state.tasksAll.filter(x=>!x.done).length;
  s+='未完成待办：'+undone+' 条';
  return s;
}

function inboxHtml(){
  if(!pushCache) return '';
  const d=pushCache;
  const cats=['新闻联播','AI日报','财务日报'].filter(c=>(d.digest[c]||[]).length);
  const hasRem=!!d.reminder;
  if(!cats.length && !hasRem) return '';
  const emojiOf=c=>c==='新闻联播'?'📺':c==='AI日报'?'🤖':c==='财务日报'?'💹':'📌';
  const read=(state.readPush||[]);
  let h='<div class="card inbox"><div class="inbox-head"><h3>📨 琥珀来信</h3><span class="sub">来自琥珀的每日推送 · 不在 WorkBuddy，直接在 agent 里看</span></div>';
  cats.forEach(c=>{
    const items=(d.digest[c]||[]).filter(it=>it && it.title);
    if(!items.length) return;
    h+='<div class="inbox-cat">'+emojiOf(c)+' <b>'+escapeHtml(c)+'</b></div><ul class="inbox-list">';
    items.forEach(it=>{
      const key=it.title; const isRead=read.includes(key);
      h+='<li class="inbox-item'+(isRead?' read':'')+'"><div class="inbox-title">'+escapeHtml(it.title)+
         (isRead?'':'<span class="dot-new">新</span>')+'</div>'+
         (it.point?'<div class="inbox-point">'+escapeHtml(it.point)+'</div>':'')+
         (it.why?'<div class="inbox-why">💡 '+escapeHtml(it.why)+'</div>':'')+
         (it.link?'<a class="inbox-link" href="'+encodeURI(it.link)+'" target="_blank" rel="noopener">🔗 详情</a>':'')+
         '<span class="inbox-mark" onclick="App.markPush(\''+encodeURIComponent(key)+'\')">'+(isRead?'已读 ✓':'标记已读')+'</span></li>';
    });
    h+='</ul>';
  });
  if(hasRem){
    const rem=d.reminder; const rkey='reminder|'+(rem.generatedAt||'');
    const isRead=read.includes(rkey);
    h+='<div class="inbox-cat">🌙 <b>睡前小结</b></div>'+
       '<div class="inbox-rem'+(isRead?' read':'')+'">'+escapeHtml(rem.text||'')+
       '<span class="inbox-mark" onclick="App.markPush(\''+encodeURIComponent(rkey)+'\')">'+(isRead?'已读 ✓':'标记已读')+'</span></div>';
  }
  h+='</div>';
  return h;
}

function renderPoints(pts){
  if(!pts||!pts.length) return '<li class="sub">（无要点）</li>';
  return pts.map(p=>{
    if(typeof p==='string') return `<li>${escapeHtml(p)}</li>`;
    const sub=(p.sub&&p.sub.length)?`<ul class="note-sub">${p.sub.map(s=>`<li>${escapeHtml(s)}</li>`).join('')}</ul>`:'';
    return `<li class="note-item"><div class="note-t">${escapeHtml(p.t||'')}</div>${p.d?`<div class="note-d">${escapeHtml(p.d)}</div>`:''}${sub}</li>`;
  }).join('');
}
function notesGroupedHtml(){
  const CATS=['新闻联播','AI日报','财务日报','齐昊','夏鹏'];
  const list=state.notes.map((n,idx)=>({n,idx,cat:(n&&n.cat)||'未分类'}));
  const map={}; list.forEach(o=>{(map[o.cat]=map[o.cat]||[]).push(o);});
  const keys=[]; CATS.forEach(c=>{if(map[c])keys.push(c);});
  Object.keys(map).forEach(c=>{if(CATS.indexOf(c)<0)keys.push(c);});
  if(!keys.length) return '<div class="empty">还没有笔记。对琥珀说「笔记 标题 | 要点1；要点2 | 链接」即可生成<b>要点笔记</b>（链接可留空，默认看要点即可）。</div>';
  const card=(n,i)=>`<div class="note">
      <div class="note-h"><b>📒 ${escapeHtml(n.title)}</b><span class="sub">${n.date||''}</span>${n.link?`<a class="btn sm ghost" href="${escapeHtml(n.link)}" target="_blank" rel="noopener">🔗 查看原文</a>`:''}<span class="btn sm ghost" onclick="App.del('notes',${i})">删</span></div>
      <ol class="note-pts">${renderPoints(n.points)}</ol>

  return keys.map(c=>`<div style="margin-top:10px"><div style="font-weight:700;color:var(--gold);margin:6px 0 4px">📁 ${escapeHtml(c)} <span class="sub">${map[c].length} 条</span></div>${map[c].map(o=>card(o.n,o.idx)).join('')}</div>`).join('');
}

function changeAvatar(){
  const inp=document.createElement('input');
  inp.type='file';
  inp.accept='image/png,image/jpeg,image/gif,image/webp';
  inp.onchange=function(e){
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=function(){
      const a=document.querySelector('.logo .ava');
      if(a){ a.innerHTML='<img src="'+r.result+'" alt="头像" onerror="this.parentNode.textContent=\'🟡\'"/>'; }
      localStorage.setItem('hupo_avatar', r.result);
      syncFavicon(r.result);
      toast('头像已更新（手机图标也已同步）');
    };
    r.readAsDataURL(f);
  };
  inp.click();
}
function loadAvatar(){
  const src=localStorage.getItem('hupo_avatar');
  if(src){
    const a=document.querySelector('.logo .ava');
    if(a){ a.innerHTML='<img src="'+src+'" alt="头像" onerror="this.parentNode.textContent=\'🟡\'"/>'; }
    syncFavicon(src);
  }
}
function syncFavicon(href){
  const links=[
    {sel:'link[rel="icon"]', rel:'icon'},
    {sel:'link[rel="apple-touch-icon"]', rel:'apple-touch-icon'}
  ];
  links.forEach(o=>{
    let l=document.querySelector(o.sel);
    if(!l){ l=document.createElement('link'); l.rel=o.rel; document.head.appendChild(l); }
    l.href=href;
    if(!href.startsWith('data:')) l.sizes='512x512';
  });
}

/* ============ 语音录入 ============ */
let voiceRec=null, voiceActive=false;
function startVoice(){
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast('当前浏览器不支持语音，请用 Chrome/Edge'); return; }
  if(voiceActive){ if(voiceRec)voiceRec.stop(); return; }
  voiceRec=new SR(); voiceRec.lang='zh-CN'; voiceRec.interimResults=false; voiceRec.maxAlternatives=1;
  voiceRec.onstart=()=>{ voiceActive=true; const b=document.getElementById('micBtn'); if(b){b.classList.add('recording');} toast('正在聆听…说完自动填入'); };
  voiceRec.onresult=(e)=>{ const t=e.results[0][0].transcript; const i=document.getElementById('chatIn'); if(i){ i.value=(i.value?i.value+' ':'')+t; i.focus(); } };
  voiceRec.onerror=()=>toast('语音识别出错，请重试');
  voiceRec.onend=()=>{ voiceActive=false; const b=document.getElementById('micBtn'); if(b)b.classList.remove('recording'); };
  try{ voiceRec.start(); }catch(e){ toast('无法启动语音'); }
}

/* ============ 拍照 ============ */
let cameraStream=null, cameraFor='';
function openCamera(forView){
  cameraFor = forView||'';
  const root=document.getElementById('modalRoot');
  root.innerHTML=`<div class="modal-mask" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h2>📷 拍照 <button class="close" onclick="closeCamera()">✕</button></h2>
    <video id="camVideo" autoplay playsinline muted></video>
    <div class="addbar" style="margin-top:12px">
      <button class="btn" onclick="capturePhoto()">📸 拍摄</button>
      <button class="btn ghost" onclick="closeCamera()">取消</button>
    </div>
    <canvas id="camCanvas" style="display:none"></canvas>
  </div></div>`;
  const v=document.getElementById('camVideo');
  if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false})
      .then(s=>{ cameraStream=s; v.srcObject=s; })
      .catch(()=>{ v.outerHTML='<div class="preview">⚠️ 无法访问摄像头（桌面端无摄像头或权限被拒）。可改用「上传图片」。</div>'; });
  } else { v.outerHTML='<div class="preview">当前环境不支持摄像头，请用「上传图片」。</div>'; }
}
function capturePhoto(){
  const v=document.getElementById('camVideo'); const c=document.getElementById('camCanvas'); if(!v||!c)return;
  c.width=v.videoWidth||640; c.height=v.videoHeight||480;
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  const url=c.toDataURL('image/png');
  const noteEl=document.getElementById('photoNote'); const note=(noteEl&&noteEl.value)||'';
  state.photos.unshift({date:todayStr(), url, note, task: cameraFor==='review'?'复盘配图':''});
  save();
  if(cameraFor==='review'){ state.reviews.unshift({date:todayStr(), text:'[图片复盘] '+(note||'')}); state.weekly.review+=1; gainXP(REWARDS.review.xp,REWARDS.review.coin); unlockAch('first_review'); }
  closeCamera(); curView='photos'; render(); toast('照片已存入相册');
}
function closeCamera(){ if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;} closeModal(); }

  try{ const wb=XLSX.read(new Uint8Array(r.result),{type:'array'}); const ws=wb.Sheets[wb.SheetNames[0]]; const rows=XLSX.utils.sheet_to_json(ws);
    let added=0;

    });

  }catch(err){ toast('Excel 解析失败'); }

  mindGen(){
    const txt=document.getElementById('mindText').value;
    const lines=txt.split('\n').map(s=>s.replace(/\t/g,'  ')).filter(l=>l.trim());
    const root={name:'',children:[],depth:0}; const stack=[root];
    lines.forEach(l=>{ const indent=l.length-l.trimStart().length; const name=l.trim().replace(/^[-*]\s*/,''); const node={name,children:[],depth:Math.floor(indent/2)};
      while(stack.length>1 && stack[stack.length-1].depth>=node.depth) stack.pop();
      stack[stack.length-1].children.push(node); stack.push(node); });
    const tree=root.children[0]||{name:'中心',children:[]};
    document.getElementById('mindOut').innerHTML=Skills.renderMind(tree,900,600);
  },
  renderMind(node,w,h){
    function layout(n,depth,x,y){ n._x=x; n._y=y; if(n.children&&n.children.length){ const gap=58; const sy=y-((n.children.length-1)*gap)/2; n.children.forEach(c=>{ layout(c,depth+1,x+170,sy); sy+=gap; }); } }
    layout(node,0,90,300);
    let boxes='', lines='';
    function draw(n){ const ww=120,hh=34; boxes+=`<rect x="${n._x}" y="${n._y-hh/2}" width="${ww}" height="${hh}" rx="10" fill="#eaf4ff" stroke="#5b9cf0"/><text x="${n._x+ww/2}" y="${n._y+5}" text-anchor="middle" font-size="13" fill="#3a3f55">${escapeHtml(n.name)}</text>`;
      if(n.children) n.children.forEach(c=>{ lines+=`<line x1="${n._x+ww}" y1="${n._y}" x2="${c._x}" y2="${c._y}" stroke="#b69cf0" stroke-width="2"/>`; draw(c); }); }
    draw(node);
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" xmlns="http://www.w3.org/2000/svg">${lines}${boxes}</svg>`;
  },

    docx.Packer.toBlob(new docx.Document({sections:[{children:ch}]})).then(b=>{downloadBlob(b,title+'.docx');toast('已生成');closeModal();}).catch(()=>toast('失败')); },
  pomodoro(){ openModal(`<h2>⏱ 专注计时 <button class="close" onclick="closeModal()">✕</button></h2>
    <div id="pomoTime" style="font-size:48px;text-align:center;margin:16px 0;font-weight:bold">25:00</div>
    <div class="addbar"><button class="btn" onclick="Skills.pomoStart()">▶ 开始</button><button class="btn ghost" onclick="Skills.pomoPause()">⏸ 暂停</button><button class="btn ghost" onclick="Skills.pomoReset()">↺ 重置</button></div>
    <div class="sub" style="margin-top:8px">专注25分钟，结束提示你休息。完成后请在对话里说「专注25分钟」记一次学习打卡。</div>`);
    Skills._pomoLeft=25*60; },
  pomoStart(){ if(Skills._pomoTimer)return; Skills._pomoTimer=setInterval(()=>{ Skills._pomoLeft--; const m=Math.floor(Skills._pomoLeft/60),s=Skills._pomoLeft%60; const el=document.getElementById('pomoTime'); if(el)el.textContent=m+':'+(s<10?'0':'')+s; if(Skills._pomoLeft<=0){ clearInterval(Skills._pomoTimer); Skills._pomoTimer=null; toast('专注完成！去对话说「专注25分钟」记打卡'); closeModal(); } },1000); },
  pomoPause(){ if(Skills._pomoTimer){clearInterval(Skills._pomoTimer);Skills._pomoTimer=null;} },
  pomoReset(){ if(Skills._pomoTimer){clearInterval(Skills._pomoTimer);Skills._pomoTimer=null;} Skills._pomoLeft=25*60; const el=document.getElementById('pomoTime'); if(el)el.textContent='25:00'; },
  calc(){ openModal(`<h2>🧮 计算器 <button class="close" onclick="closeModal()">✕</button></h2>
    <input id="calcIn" style="width:100%;font-size:22px;text-align:right;margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:10px" value="0"/>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
    ${['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+'].map(k=>`<button class="btn ${k==='='?'':'ghost'}" onclick="Skills.calcKey('${k}')">${k}</button>`).join('')}
    </div><div class="addbar" style="margin-top:8px"><button class="btn ghost" onclick="Skills.calcKey('C')">清空</button></div>`); },
  calcKey(k){ const i=document.getElementById('calcIn'); if(k==='C'){i.value='0';return;} if(k==='='){ try{i.value=String(eval(i.value));}catch(e){i.value='错误';} return;} if(i.value==='0'&&k!=='.')i.value=k; else i.value+=k; },
  open(type){
    if(type==='data') return DataModal.open();
    if(type==='ppt') return this.ppt();
    if(type==='image') return this.image();
    if(type==='doc') return this.doc();
    if(type==='mind') return this.mind();
    if(type==='tts') return this.tts();
    if(type==='translate') return this.translate();
    if(type==='resume') return this.resume();
    if(type==='pomodoro') return this.pomodoro();
    if(type==='calc') return this.calc();
    return this.data();
  },
};
window.Skills=Skills;

/* ============ 启动 ============ */
// 兼容旧版(v1)数据
try{ if(!localStorage.getItem(STORE_KEY) && localStorage.getItem('hupo_agent_v1')){ localStorage.setItem(STORE_KEY, localStorage.getItem('hupo_agent_v1')); } }catch(e){}
state = load();
function tick(){
  const d=new Date(); const wd=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  const clk=document.getElementById('clock'); if(clk) clk.textContent=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${wd} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  const cd=document.getElementById('countdown'); if(cd){ const due=nearestDue(); if(due){ const diff=due.due-d.getTime(); cd.innerHTML = diff>0? ('⏰ '+escapeHtml(due.text)+' 还有 '+fmtDur(diff)) : ('⏰ '+escapeHtml(due.text)+' 已到期'); } else cd.textContent='⏰ 暂无倒计时提醒'; }
}
setInterval(tick,1000); tick();
setInterval(syncPull, 15000);
// 每日10点消费分类提醒（本地，不依赖外部连接器）
(function(){
  if(!('Notification' in window)) return;
  setInterval(()=>{
    const n=new Date();
    if(state.billRemind && n.getHours()===10 && n.getMinutes()===0){
      const key='hupo_billremind_'+n.toDateString();
      if(!localStorage.getItem(key)){
        localStorage.setItem(key,'1');
        const body='打开琥珀→财务，导入/分类今天的支出（个人 / 公司垫付 / 其他）';
        if(Notification.permission==='granted'){ try{ new Notification('琥珀：该分类今日消费啦',{body}); }catch(e){} }
        toast('⏰ 该分类今天的消费啦（个人/公司垫付/其他）');
      }
    }
  }, 60000);
})();
normalize(); save(); render();
syncPull();
</script>
